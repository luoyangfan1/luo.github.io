<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🧲 磁铁指向南北 · 磁偏角左偏10°</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #b8d9d0;
            font-family: 'Segoe UI', Roboto, 'Comic Sans MS', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .lab-box {
            max-width: 1000px;
            width: 100%;
            background: #fef9e7;
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 30px rgba(30, 60, 90, 0.3);
            padding: 20px 20px 30px;
            border: 6px solid #f7b773;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffddb0;
            padding: 12px 25px;
            border-radius: 50px;
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #2e4c6b;
            border: 4px solid #c57c3e;
        }
        h1 span {
            background: #fff2b0;
            font-size: 1.3rem;
            padding: 5px 20px;
            border-radius: 40px;
        }
        .canvas-wrapper {
            background: #c2e3f0;
            border-radius: 40px;
            padding: 15px;
            border: 5px solid #4799b3;
            box-shadow: inset 0 0 0 3px #25677e;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #edf7fc;
            border-radius: 30px;
            border: 3px solid #3f8da0;
            cursor: grab;
            touch-action: none;
        }
        .button-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 18px 0 15px;
        }
        .btn {
            background: #fec165;
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 50px;
            color: #2d3e45;
            border: 3px solid #bf6f13;
            box-shadow: 0 5px 0 #9e5c0f;
            transition: 0.05s linear;
            cursor: pointer;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        .btn.earth {
            background: #a7d0f0;
            border-color: #2a6f8a;
            box-shadow: 0 5px 0 #1d4f63;
        }
        .info-panel {
            background: #e2f0da;
            border-radius: 40px;
            padding: 15px 25px;
            margin: 15px 0 10px;
            border: 5px solid #6f9e7a;
            font-size: 1.2rem;
            text-align: center;
        }
        .info-panel span {
            background: white;
            padding: 5px 20px;
            border-radius: 40px;
            margin: 0 10px;
        }
        .footer-think {
            background: #ffefc0;
            border-radius: 30px;
            padding: 15px 25px;
            border-left: 15px solid #de9b42;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="lab-box">
    <h1>
        🧲 磁铁指向南北 · 磁偏角左偏10°
        <span>地理北极在下</span>
    </h1>
    <div class="canvas-wrapper">
        <canvas id="magnetCanvas" width="800" height="600"></canvas>
    </div>
    <div class="button-bar">
        <button class="btn" id="togglePolarityBtn">🔍 显示磁极 (红N 蓝S)</button>
        <button class="btn earth" id="toggleEarthBtn">🌍 显示地球 (包裹实验)</button>
    </div>
    <div class="info-panel">
        ⭐ 白色磁铁时你不知道哪端是N/S，转一转松开，它会指向地理北极偏西约10°（磁偏角左偏）。
        <span>🧭 地理北极(N)在下，地理南极(S)在上</span>
    </div>
    <div class="footer-think">
        <strong>✨ 磁偏角：</strong> 磁铁N极指向地理北极偏西约10°（红色虚线），地理轴为黑色虚线。注意地理北极在下，南极在上。
    </div>
</div>
<script>
(function() {
    const canvas = document.getElementById('magnetCanvas');
    const ctx = canvas.getContext('2d');

    const CW = 800, CH = 600;

    // 全局是否显示极性 (红蓝)
    let showPolarity = false;
    // 是否显示地球
    let showEarth = false;

    // 磁偏角大小 (正值表示偏西角度，但目标角度取负以实现左偏)
    const DECLINATION_ANGLE = 0.17; // 约10°
    // 磁铁最终指向角度：左偏为负
    const TARGET_ANGLE = -DECLINATION_ANGLE;

    // 物理常数
    const STIFFNESS = 0.018;      // 回复力矩系数
    const DAMPING = 0.012;        // 阻尼系数
    const INERTIA_FACTOR = 0.4;    // 释放时惯性系数

    // 两个磁铁 (俯视图) —— 初始角度设为0，使磁铁竖直
    const magnets = [
        { // 悬挂磁铁 (上)
            type: 'hang',
            x: 400, y: 180,
            angle: 0.0,           // 竖直：N极朝上，S极朝下
            v: 0,
            dragging: false,
            dragLastAngle: 0,
            dragLastTime: 0,
            dragVel: 0,
            len: 80,              // 长度
            wid: 26               // 宽度
        },
        { // 水浮磁铁 (下) - 放在碗里，碗浮在水盆中
            type: 'float',
            x: 400, y: 440,
            angle: 0.0,           // 竖直
            v: 0,
            dragging: false,
            dragLastAngle: 0,
            dragLastTime: 0,
            dragVel: 0,
            len: 70,               // 磁铁略小，适合放在碗内
            wid: 24
        }
    ];

    // 获取鼠标/触摸坐标 (画布像素)
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = CW / rect.width;
        const scaleY = CH / rect.height;
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    // 根据点坐标计算相对于磁铁中心的角度 (0 = 指向正上方/北)
    function calcAngleFromPoint(mag, px, py) {
        const dx = px - mag.x;
        const dy = py - mag.y;
        // 返回角度：当鼠标在磁铁正上方(北)时，角度应为0；即向量(0,-1)对应0
        // 使用 atan2(dx, -dy) 实现：鼠标右方dx正，dy=0 => 角度 PI/2；鼠标上方dx=0,dy负 => -dy正 => 0
        let angle = Math.atan2(dx, -dy);
        return angle;
    }

    // 判断哪个磁铁被点中 (基于中心距离)
    function getMagnetAt(px, py) {
        for (let mag of magnets) {
            const dx = px - mag.x;
            const dy = py - mag.y;
            if (Math.hypot(dx, dy) < 50) return mag;
        }
        return null;
    }

    // 绘制单个磁铁
    function drawMagnet(mag) {
        if (mag.type === 'hang') {
            drawHangMagnet(mag);
        } else {
            drawFloatMagnet(mag);
        }
    }

    // 绘制悬挂磁铁 (俯视图) + 在旁边加一个小正视图图标
    function drawHangMagnet(mag) {
        // 俯视图磁铁
        ctx.save();
        ctx.translate(mag.x, mag.y);
        ctx.rotate(mag.angle);
        ctx.shadowColor = '#808080';
        ctx.shadowBlur = 8;

        const halfL = mag.len / 2;
        const halfW = mag.wid / 2;

        drawMagnetBody(mag, halfL, halfW);

        ctx.restore();

        // 悬挂点 (俯视只能看到一个点)
        ctx.beginPath();
        ctx.fillStyle = '#8b5a2b';
        ctx.arc(mag.x, mag.y - halfL - 10, 4, 0, 2*Math.PI);
        ctx.fill();

        // 在旁边画一个简单的正视图小图标 (支架+悬挂磁铁侧影)
        ctx.save();
        ctx.translate(mag.x + 140, mag.y - 40);
        ctx.font = 'bold 14px "Segoe UI"';
        ctx.fillStyle = '#5f4d3e';
        ctx.fillText('正视图', -30, -10);

        // 画支架 (倒T)
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(-5, 0, 10, 40);
        ctx.fillRect(-20, 40, 40, 6);
        // 悬挂线
        ctx.beginPath();
        ctx.strokeStyle = '#5a3e2b';
        ctx.lineWidth = 1;
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 30);
        ctx.stroke();
        // 磁铁侧影 (小矩形，上红下蓝示意极性)
        ctx.fillStyle = showPolarity ? '#DC143C' : '#aaa';
        ctx.fillRect(-10, 30, 20, 12);
        if (showPolarity) {
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(-10, 42, 20, 12);
        }
        ctx.restore();
    }

    // 绘制水浮磁铁 (俯视图，碗在水盆里，碗和磁铁一起旋转)
    function drawFloatMagnet(mag) {
        // 绘制水盆 (固定，不旋转)
        ctx.save();
        ctx.translate(mag.x, mag.y);
        // 水盆
        ctx.fillStyle = '#a6d4f0';
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.ellipse(0, 0, 100, 70, 0, 0, 2*Math.PI);
        ctx.fill();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#5f9ea0';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.ellipse(0, 0, 100, 70, 0, 0, 2*Math.PI);
        ctx.stroke();
        ctx.setLineDash([]);

        // 水波纹 (固定)
        ctx.strokeStyle = '#4682b4';
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.4;
        for (let i = 1; i <= 3; i++) {
            ctx.beginPath();
            ctx.ellipse(0, 0, 85 + i*7, 60 + i*5, 0, 0, 2*Math.PI);
            ctx.stroke();
        }
        ctx.restore();

        // 绘制碗和磁铁 (整体旋转，碗随磁铁转)
        ctx.save();
        ctx.translate(mag.x, mag.y);
        ctx.rotate(mag.angle);
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#b0b0b0';

        // 绘制碗 (椭圆)
        ctx.fillStyle = '#f0e5d5';
        ctx.beginPath();
        ctx.ellipse(0, 0, 60, 45, 0, 0, 2*Math.PI);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#c9ae74';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, 60, 45, 0, 0, 2*Math.PI);
        ctx.stroke();

        // 碗内底阴影 (也旋转，增强立体感)
        ctx.fillStyle = '#dac8a7';
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.ellipse(0, 5, 50, 35, 0, 0, 2*Math.PI);
        ctx.fill();

        // 磁铁 (绘制在碗中央)
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 8;
        const halfL = mag.len / 2;
        const halfW = mag.wid / 2;
        drawMagnetBody(mag, halfL, halfW);
        ctx.restore();
    }

    // 磁铁主体绘制 (无状态变换, 假设已经translate和rotate)
    function drawMagnetBody(mag, halfL, halfW) {
        if (!showPolarity) {
            // 纯白色磁铁，两端浅灰微差但不易察觉
            ctx.fillStyle = '#f0f0f0';
            ctx.beginPath();
            ctx.rect(-halfW, -halfL, mag.wid, mag.len);
            ctx.fill();
            // 两端半圆稍微加深一点轮廓
            ctx.fillStyle = '#e8e8e8';
            ctx.beginPath();
            ctx.arc(0, -halfL, halfW, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, halfL, halfW, 0, 2*Math.PI);
            ctx.fill();
        } else {
            // 显示极性: N极(红)在上半，S极(蓝)在下半
            // 上半 (N)
            ctx.fillStyle = '#DC143C';
            ctx.beginPath();
            ctx.rect(-halfW, -halfL, mag.wid, halfL);
            ctx.fill();
            // 下半 (S)
            ctx.fillStyle = '#4169E1';
            ctx.beginPath();
            ctx.rect(-halfW, 0, mag.wid, halfL);
            ctx.fill();
            // 两端半圆
            ctx.beginPath();
            ctx.fillStyle = '#DC143C';
            ctx.arc(0, -halfL, halfW, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.fillStyle = '#4169E1';
            ctx.arc(0, halfL, halfW, 0, 2*Math.PI);
            ctx.fill();
        }

        // 中心小点
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#4d4d4d';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, 2*Math.PI);
        ctx.fill();

        if (showPolarity) {
            ctx.font = 'bold 16px "Segoe UI"';
            ctx.fillStyle = 'white';
            ctx.fillText('N', -8, -halfL+20);
            ctx.fillText('S', -8, halfL-15);
        }
    }

    // 绘制方向标 (俯视指南针) - 当不显示地球时使用，显示地球时地球自带方向标
    function drawCompass() {
        if (showEarth) return; // 地球背景已经包含了方向标
        ctx.font = 'bold 30px "Segoe UI"';
        ctx.fillStyle = '#2b5e5e';
        ctx.fillText('N', 380, 40);
        ctx.fillText('S', 380, 570);
        ctx.fillText('W', 40, 310);
        ctx.fillText('E', 730, 310);
    }

    // 绘制巨大的地球背景 (包裹两个实验)
    function drawEarth() {
        if (!showEarth) return;

        const earthX = 400;
        const earthY = 300;
        const radius = 270; // 足够覆盖两个磁铁

        // 地球海洋渐变
        const gradient = ctx.createRadialGradient(earthX-50, earthY-50, 100, earthX, earthY, radius+20);
        gradient.addColorStop(0, '#a6c9e8');
        gradient.addColorStop(0.7, '#3d6f9e');
        gradient.addColorStop(1, '#1b3b5c');
        ctx.fillStyle = gradient;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#304050';
        ctx.beginPath();
        ctx.arc(earthX, earthY, radius, 0, 2*Math.PI);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 大陆轮廓 (简单绘制亚欧大陆、非洲、美洲示意)
        ctx.save();
        ctx.translate(earthX, earthY);
        ctx.scale(1, 0.98); // 稍微压扁一点更像地球
        ctx.fillStyle = '#8fbc8f';
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#2d4d2d';
        ctx.globalAlpha = 0.7;

        // 亚欧大陆 (一团)
        ctx.beginPath();
        ctx.moveTo(70, -100);
        ctx.lineTo(120, -80);
        ctx.lineTo(150, -30);
        ctx.lineTo(130, 20);
        ctx.lineTo(80, 40);
        ctx.lineTo(20, 20);
        ctx.lineTo(-10, -30);
        ctx.lineTo(20, -70);
        ctx.closePath();
        ctx.fill();

        // 非洲
        ctx.beginPath();
        ctx.moveTo(30, 40);
        ctx.lineTo(70, 50);
        ctx.lineTo(80, 90);
        ctx.lineTo(40, 110);
        ctx.lineTo(0, 80);
        ctx.lineTo(10, 50);
        ctx.closePath();
        ctx.fill();

        // 美洲 (左边)
        ctx.beginPath();
        ctx.moveTo(-100, -40);
        ctx.lineTo(-60, -50);
        ctx.lineTo(-40, -10);
        ctx.lineTo(-70, 30);
        ctx.lineTo(-120, 10);
        ctx.closePath();
        ctx.fill();

        // 澳洲
        ctx.beginPath();
        ctx.moveTo(100, 100);
        ctx.lineTo(140, 90);
        ctx.lineTo(150, 130);
        ctx.lineTo(110, 140);
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        // 画几条纬线
        for (let lat = -60; lat <= 60; lat += 30) {
            let y = - (lat / 90) * radius * 0.9;
            let r = radius * Math.cos(lat * Math.PI/180) * 0.9;
            ctx.beginPath();
            ctx.ellipse(0, y, r, r * 0.3, 0, 0, 2*Math.PI);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.stroke();
        }

        ctx.restore();

        // 地理轴 (竖直黑色虚线) —— 注意：地理北极在下，南极在上
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(earthX, earthY - radius);
        ctx.lineTo(earthX, earthY + radius);
        ctx.stroke();
        ctx.setLineDash([]);

        // 地理北极 (N) 在下，地理南极 (S) 在上
        ctx.font = 'bold 30px "Segoe UI"';
        ctx.fillStyle = '#2d4f4f';
        ctx.fillText('地理南极 S', earthX - 70, earthY - radius - 15); // 上
        ctx.fillText('地理北极 N', earthX - 70, earthY + radius + 35); // 下

        // 地磁轴 (红色虚线，左偏10°) —— 用 -DECLINATION_ANGLE 实现左偏
        const magLen = radius * 0.9;
        const dx = magLen * Math.sin(-DECLINATION_ANGLE); // 负值使上端偏左
        const dy = magLen * Math.cos(-DECLINATION_ANGLE); // 正值
        ctx.strokeStyle = '#b34141';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(earthX, earthY);
        ctx.lineTo(earthX + dx, earthY - dy);
        ctx.moveTo(earthX, earthY);
        ctx.lineTo(earthX - dx, earthY + dy);
        ctx.stroke();
        ctx.setLineDash([]);

        // 标注磁偏角 (小字)
        ctx.font = 'bold 16px "Segoe UI"';
        ctx.fillStyle = '#b34141';
        ctx.fillText('磁偏角 ~10° 左偏', earthX - 60, earthY + 10);

        // 画方向标W/E (小字)
        ctx.font = 'bold 20px "Segoe UI"';
        ctx.fillStyle = '#2d4f4f';
        ctx.fillText('W', earthX - radius - 30, earthY + 10);
        ctx.fillText('E', earthX + radius + 10, earthY + 10);
    }

    // 绘制所有
    function drawScene() {
        ctx.clearRect(0, 0, CW, CH);
        // 浅色网格 (先画，但会被地球覆盖一部分)
        ctx.strokeStyle = '#d6e6f5';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < CW; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, CH);
            ctx.strokeStyle = '#d0e0ed';
            ctx.stroke();
        }
        for (let i = 0; i < CH; i += 40) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(CW, i);
            ctx.strokeStyle = '#d0e0ed';
            ctx.stroke();
        }

        // 先绘制地球背景 (如果显示)
        drawEarth();

        // 然后绘制常规指南针方向标（如果不显示地球）
        drawCompass();

        // 标注文字 (实验名称)
        ctx.font = 'bold 20px "Segoe UI"';
        ctx.fillStyle = '#5f7e8c';
        ctx.fillText('🧵 悬挂 (俯视)', 80, 80);
        ctx.fillText('🥣 水浮 (碗随磁铁转)', 80, 340);

        // 绘制磁铁 (覆盖在地球之上)
        magnets.forEach(m => drawMagnet(m));
    }

    // 物理更新 (用于非拖拽状态)
    function physicsUpdate() {
        magnets.forEach(mag => {
            if (!mag.dragging) {
                // 目标角度为 TARGET_ANGLE (左偏)
                let error = TARGET_ANGLE - mag.angle;
                // 归一化到 [-PI, PI]
                while (error > Math.PI) error -= 2*Math.PI;
                while (error < -Math.PI) error += 2*Math.PI;

                // 回复力矩 + 阻尼
                let torque = STIFFNESS * error - DAMPING * mag.v;
                mag.v += torque;
                // 微小空气阻尼
                mag.v *= 0.992;
                mag.angle += mag.v;

                // 归一化angle
                if (mag.angle > Math.PI) mag.angle -= 2*Math.PI;
                if (mag.angle < -Math.PI) mag.angle += 2*Math.PI;
            }
        });
        drawScene();
        requestAnimationFrame(physicsUpdate);
    }

    // 事件处理: 拖拽
    let draggedMag = null;

    function startDrag(e) {
        e.preventDefault();
        const { x, y } = getCanvasCoords(e);
        const mag = getMagnetAt(x, y);
        if (mag) {
            mag.dragging = true;
            draggedMag = mag;
            // 记录初始角度和时间
            mag.dragLastAngle = calcAngleFromPoint(mag, x, y);
            mag.dragLastTime = performance.now();
            mag.dragVel = 0;
            // 直接设定角度
            mag.angle = mag.dragLastAngle;
            canvas.style.cursor = 'grabbing';
        }
    }

    function dragMove(e) {
        if (!draggedMag) return;
        e.preventDefault();
        const { x, y } = getCanvasCoords(e);
        const newAngle = calcAngleFromPoint(draggedMag, x, y);
        const now = performance.now();
        const dt = now - draggedMag.dragLastTime;
        if (dt > 0) {
            // 计算瞬时角速度 (注意角度差可能需要归一化)
            let angleDiff = newAngle - draggedMag.dragLastAngle;
            if (angleDiff > Math.PI) angleDiff -= 2*Math.PI;
            if (angleDiff < -Math.PI) angleDiff += 2*Math.PI;
            const instVel = angleDiff / dt * 16; // 乘以系数使惯性合适
            draggedMag.dragVel = instVel * 0.5 + draggedMag.dragVel * 0.5;
        }
        draggedMag.angle = newAngle;
        draggedMag.dragLastAngle = newAngle;
        draggedMag.dragLastTime = now;
        drawScene();
    }

    function stopDrag(e) {
        if (draggedMag) {
            draggedMag.v = draggedMag.dragVel * INERTIA_FACTOR;
            draggedMag.dragging = false;
            draggedMag = null;
            canvas.style.cursor = 'grab';
            e.preventDefault();
        }
    }

    // 触摸事件
    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', dragMove);
    window.addEventListener('mouseup', stopDrag);

    canvas.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('touchmove', dragMove, { passive: false });
    window.addEventListener('touchend', stopDrag);
    window.addEventListener('touchcancel', stopDrag);

    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

    // 按钮: 切换显示磁极
    document.getElementById('togglePolarityBtn').addEventListener('click', () => {
        showPolarity = !showPolarity;
        document.getElementById('togglePolarityBtn').innerText = showPolarity ? '🙈 隐藏磁极' : '🔍 显示磁极 (红N 蓝S)';
        drawScene();
    });

    // 按钮: 切换显示地球
    document.getElementById('toggleEarthBtn').addEventListener('click', () => {
        showEarth = !showEarth;
        document.getElementById('toggleEarthBtn').innerText = showEarth ? '🌏 隐藏地球' : '🌍 显示地球 (包裹实验)';
        drawScene();
    });

    // 启动物理循环
    physicsUpdate();

    // 初始绘制
    drawScene();
})();
</script>
</body>
</html>
